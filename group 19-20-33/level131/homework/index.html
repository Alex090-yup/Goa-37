<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register With Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-container">
        <h1>Register With Us</h1>
        <form action="" id="form">
        <div class="form-group">
            <label for="username">Username</label>
            <input class="inputUsername" type="text" id="username" placeholder="Enter username">
            <p class="errorUsername"></p>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input class="inputEmail" type="email" id="email" placeholder="Enter email">
            <p class="errorEmail"></p>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input class="inputPassword" type="password" id="password" placeholder="Enter password">
            <p class="errorPassword"></p>
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input class="confirmPassword" type="password" id="confirm-password" name="confirm-password" placeholder="Enter password again">
            <p class="errorConfirmPassword"></p>
        </div>
        
        <button type="submit">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
