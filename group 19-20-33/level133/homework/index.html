<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <label for="name">Product Name:</label>
        <input type="text" id="name" placeholder="Enter product name">
        <p class="nameError"></p>
        <label for="price">Product Price:</label>
        <input type="number" id="price" placeholder="Enter product price">
        <p class="priceError"></p>
        <label for="image">Image URL:</label>
        <input type="url" id="image" placeholder="Enter image URL">
        <label for="category">Product Category (technic , housethings, clothes):</label>
        <input type="text" id="category" placeholder="Enter category">
        <p class="categoryError"></p>
        <button type="submit">Add to Cart</button>
    </form>

    <div class="box">
        <button class="showAll" type="button">Show All</button>
        <button class="showClothes" type="button">Show Clothes</button>
        <button class="showTechnics" type="button">Show Technics</button>
        <button class="showHouseThings" type="button">Show HouseThings</button>
    </div>
    <div id="products">

    </div>
    <script src="script.js"></script>
</body>
</html>
