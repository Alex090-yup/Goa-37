<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-main">
        <div class="card-front-logo">
            <div class="card-front">
                <img class="card-logo" src="card-logo.svg" alt="">
                <h2 class="front-card-number-text">0000 0000 0000 0000</h2>
                <h5 class="front-card-name-text">JANE APPLESEED</h5>
                <h5 class="front-card-date-text">00/00</h5>
            </div>
        </div>
        <img class="card-back" src="bg-card-back.png" alt="">
    </div>

    <div class="form">
        <label for="name">CARDHOLDER NAME</label>
        <input type="text" id="name" placeholder="e.g. Jane Appleseed">

        <label for="card-number">CARD NUMBER</label>
        <input id="card-number" type="text" placeholder="e.g. 1234 5678 9123 0000">

        <div>
            <label for="MM-YY">EXP. DATE(MM/YY)</label>
            <label class="cvc" for="CVC">CVC</label>
        </div>
        

        <div class="date-cvc">
            <input class="MM-YY" type="text" placeholder="MM">
            <input class="MM-YY" type="text" placeholder="YY">
            <input id="CVC" type="text" placeholder="e.g. 123">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
